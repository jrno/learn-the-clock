<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#feca57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48dbfb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)"/>

  <!-- Clock face -->
  <circle cx="256" cy="256" r="180" fill="white" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ff6b6b" stroke-width="12"/>

  <!-- Clock numbers -->
  <text x="256" y="120" text-anchor="middle" font-size="48" font-weight="bold" fill="#5f27cd" font-family="Arial, sans-serif">12</text>
  <text x="392" y="270" text-anchor="middle" font-size="48" font-weight="bold" fill="#5f27cd" font-family="Arial, sans-serif">3</text>
  <text x="256" y="420" text-anchor="middle" font-size="48" font-weight="bold" fill="#5f27cd" font-family="Arial, sans-serif">6</text>
  <text x="120" y="270" text-anchor="middle" font-size="48" font-weight="bold" fill="#5f27cd" font-family="Arial, sans-serif">9</text>

  <!-- Hour hand pointing to 3 -->
  <line x1="256" y1="256" x2="330" y2="256" stroke="#ff6b6b" stroke-width="14" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Minute hand pointing to 12 -->
  <line x1="256" y1="256" x2="256" y2="130" stroke="#48dbfb" stroke-width="10" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="18" fill="#5f27cd" filter="url(#shadow)"/>
</svg>
