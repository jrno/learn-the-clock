<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn the Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 20%, #48dbfb 40%, #1dd1a1 60%, #ff9ff3 80%, #feca57 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2d3436;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating shapes background */
        body::before {
            content: '';
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.3) 2px, transparent 2px),
                radial-gradient(circle, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 100px 100px, 50px 50px;
            background-position: 0 0, 25px 25px;
            animation: float 20s linear infinite;
            z-index: 0;
        }

        @keyframes float {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(50px, 50px) rotate(360deg); }
        }

        .container {
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .welcome-screen, .game-screen {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 50px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 10px rgba(255, 255, 255, 0.1),
                inset 0 0 30px rgba(255, 255, 255, 0.8);
            border: 5px solid #fff;
            animation: bounceIn 0.6s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #1dd1a1, #ff9ff3);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowText 3s ease infinite;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
        }

        @keyframes rainbowText {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        .welcome-subtitle {
            font-size: 1.3em;
            color: #5f27cd;
            margin-bottom: 30px;
            font-weight: bold;
        }

        input {
            font-size: 1.5em;
            padding: 15px 25px;
            border: 4px solid #ff6b6b;
            border-radius: 50px;
            margin: 10px;
            font-family: inherit;
            outline: none;
            background: white;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        input:focus {
            border-color: #48dbfb;
            box-shadow: 0 6px 25px rgba(72, 219, 251, 0.5);
            transform: scale(1.05);
        }

        button {
            font-size: 1.5em;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff9ff3 100%);
            color: white;
            cursor: pointer;
            margin: 10px;
            font-family: inherit;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:hover {
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 0 12px 30px rgba(255, 107, 107, 0.6);
        }

        button:active {
            transform: scale(0.95) rotate(0deg);
        }

        .hidden {
            display: none;
        }

        .clock-container {
            margin: 30px auto;
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        #clock {
            background: white;
            border-radius: 50%;
            box-shadow:
                0 10px 50px rgba(0, 0, 0, 0.3),
                inset 0 0 50px rgba(255, 107, 107, 0.1);
            border: 8px solid #ff6b6b;
        }

        .clock-number {
            fill: #5f27cd;
            font-size: 28px;
            font-weight: bold;
            font-family: 'Comic Sans MS', cursive;
        }

        .hour-hand {
            stroke: #ff6b6b;
            stroke-width: 10;
            stroke-linecap: round;
            filter: drop-shadow(0 0 5px #ff6b6b);
            transition: all 0.5s ease;
        }

        .minute-hand {
            stroke: #48dbfb;
            stroke-width: 8;
            stroke-linecap: round;
            filter: drop-shadow(0 0 5px #48dbfb);
            transition: all 0.5s ease;
        }

        .center-dot {
            fill: #5f27cd;
            filter: drop-shadow(0 0 5px #5f27cd);
        }

        .controls {
            margin-top: 20px;
        }

        select {
            font-size: 1.2em;
            padding: 12px 25px;
            border-radius: 25px;
            border: 3px solid #1dd1a1;
            margin: 10px;
            font-family: inherit;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            color: #2d3436;
        }

        select:hover {
            border-color: #ff6b6b;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(29, 209, 161, 0.3);
        }

        select:focus {
            outline: none;
            border-color: #ff9ff3;
            box-shadow: 0 5px 20px rgba(255, 159, 243, 0.5);
        }

        label {
            font-size: 1.3em;
            margin: 0 10px;
            font-weight: bold;
            color: #5f27cd;
        }

        .greeting {
            font-size: 2em;
            margin-bottom: 30px;
            color: #5f27cd;
            font-weight: bold;
            animation: wave 1s ease-in-out;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .language-selector {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            margin-top: 30px;
        }

        .flag-button {
            font-size: 4em;
            padding: 20px 30px;
            border: 5px solid transparent;
            border-radius: 25px;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.2), rgba(72, 219, 251, 0.2));
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .flag-button::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 25px;
            padding: 5px;
            background: linear-gradient(135deg, #ff6b6b, #48dbfb, #1dd1a1, #feca57);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .flag-button:hover {
            transform: scale(1.2) rotate(5deg);
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.3), rgba(72, 219, 251, 0.3));
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .flag-button:hover::after {
            opacity: 1;
        }

        .flag-button.active {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.4), rgba(255, 159, 243, 0.4));
            transform: scale(1.25);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1.25) translateY(0); }
            50% { transform: scale(1.25) translateY(-10px); }
        }

        .clocks-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .digital-clock {
            background: linear-gradient(135deg, #0f0f0f, #2d3436);
            border-radius: 20px;
            padding: 30px 50px;
            display: inline-block;
            box-shadow:
                inset 0 0 30px rgba(0, 0, 0, 0.8),
                0 10px 30px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(72, 219, 251, 0.3);
            border: 5px solid #48dbfb;
            position: relative;
            overflow: hidden;
        }

        .digital-clock::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(72, 219, 251, 0.1),
                transparent
            );
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .digital-time {
            font-family: 'Courier New', monospace;
            font-size: 4.5em;
            font-weight: bold;
            color: #48dbfb;
            text-shadow:
                0 0 10px #48dbfb,
                0 0 20px #48dbfb,
                0 0 30px #48dbfb,
                0 0 40px #1dd1a1;
            letter-spacing: 0.15em;
            position: relative;
            z-index: 1;
        }

        .time-separator {
            animation: blink 1.5s infinite;
            color: #ff6b6b;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
                text-shadow: 0 0 20px #ff6b6b;
            }
            50%, 100% {
                opacity: 0.2;
                text-shadow: none;
            }
        }

        .speak-button {
            background: linear-gradient(135deg, #1dd1a1 0%, #48dbfb 100%);
            font-size: 1.8em;
            padding: 20px 50px;
            animation: wiggle 2s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }

        .speak-button:hover {
            animation: wiggle 0.5s ease-in-out infinite;
            background: linear-gradient(135deg, #48dbfb 0%, #1dd1a1 100%);
        }

        /* Fun decorative elements */
        .star {
            position: absolute;
            font-size: 2em;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .welcome-screen .star:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .welcome-screen .star:nth-child(2) { top: 15%; right: 10%; animation-delay: 0.5s; }
        .welcome-screen .star:nth-child(3) { bottom: 20%; left: 8%; animation-delay: 1s; }
        .welcome-screen .star:nth-child(4) { bottom: 15%; right: 5%; animation-delay: 1.5s; }
    </style>
</head>
<body>
    <div class="container">
        <div id="welcomeScreen" class="welcome-screen">
            <span class="star">⭐</span>
            <span class="star">🌟</span>
            <span class="star">✨</span>
            <span class="star">💫</span>

            <h1>🕐 Learn the Clock! 🕐</h1>
            <p class="welcome-subtitle">Choose your language and let's have fun!</p>

            <div class="language-selector">
                <button class="flag-button" onclick="selectLanguage('fi-FI')" data-lang="fi-FI">🇫🇮</button>
                <button class="flag-button" onclick="selectLanguage('en-US')" data-lang="en-US">🇬🇧</button>
                <button class="flag-button" onclick="selectLanguage('nb-NO')" data-lang="nb-NO">🇳🇴</button>
            </div>

            <input type="text" id="nameInput" placeholder="What's your name?" autofocus>
            <br>
            <button onclick="startGame()">Start Playing! 🚀</button>
        </div>

        <div id="gameScreen" class="game-screen hidden">
            <div class="greeting"><span id="greetingText">Hei</span>, <span id="playerName"></span>! 👋</div>

            <div class="controls">
                <label for="hourSelect" id="hourLabel">Tunti:</label>
                <select id="hourSelect" onchange="updateClock()">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>

                <label for="minuteSelect" id="minuteLabel">Minuutit:</label>
                <select id="minuteSelect" onchange="updateClock()">
                    <option value="0" selected id="min0">00 (tasan)</option>
                    <option value="15" id="min15">15 (varttia yli)</option>
                    <option value="30" id="min30">30 (puoli)</option>
                    <option value="45" id="min45">45 (varttia vaille)</option>
                </select>
            </div>

            <div class="clocks-container">
                <div class="digital-clock">
                    <div class="digital-time">
                        <span id="digitalHour">03</span><span class="time-separator">:</span><span id="digitalMinute">00</span>
                    </div>
                </div>

                <div class="clock-container">
                    <svg id="clock" width="400" height="400" viewBox="0 0 400 400">
                        <circle cx="200" cy="200" r="190" fill="white" stroke="#ff6b6b" stroke-width="8"/>

                        <!-- Clock numbers -->
                        <text x="200" y="60" text-anchor="middle" class="clock-number">12</text>
                        <text x="285" y="90" text-anchor="middle" class="clock-number">1</text>
                        <text x="345" y="140" text-anchor="middle" class="clock-number">2</text>
                        <text x="370" y="210" text-anchor="middle" class="clock-number">3</text>
                        <text x="345" y="280" text-anchor="middle" class="clock-number">4</text>
                        <text x="285" y="330" text-anchor="middle" class="clock-number">5</text>
                        <text x="200" y="360" text-anchor="middle" class="clock-number">6</text>
                        <text x="115" y="330" text-anchor="middle" class="clock-number">7</text>
                        <text x="55" y="280" text-anchor="middle" class="clock-number">8</text>
                        <text x="30" y="210" text-anchor="middle" class="clock-number">9</text>
                        <text x="55" y="140" text-anchor="middle" class="clock-number">10</text>
                        <text x="115" y="90" text-anchor="middle" class="clock-number">11</text>

                        <!-- Minute hand (longer, blue) -->
                        <line id="minuteHand" x1="200" y1="200" x2="200" y2="70"
                              class="minute-hand"/>

                        <!-- Hour hand (shorter, red) -->
                        <line id="hourHand" x1="200" y1="200" x2="200" y2="110"
                              class="hour-hand"/>

                        <!-- Center dot -->
                        <circle cx="200" cy="200" r="15" class="center-dot"/>
                    </svg>
                </div>
            </div>

            <div class="controls">
                <button class="speak-button" onclick="tellTime()">🔊 <span id="buttonText">Kerro kellonaika!</span></button>
            </div>
        </div>
    </div>

    <script>
        let playerName = '';
        let currentLang = 'fi-FI';
        let selectedLanguage = null;

        const translations = {
            'en-US': {
                greeting: 'Hello',
                hourLabel: 'Hour:',
                minuteLabel: 'Minutes:',
                buttonText: 'Tell me the time!',
                min0: "00 (o'clock)",
                min15: '15 (quarter past)',
                min30: '30 (half past)',
                min45: '45 (quarter to)',
                oclock: (h) => `${h} o'clock`,
                quarterPast: (h) => `quarter past ${h}`,
                half: (h) => `half past ${h}`,
                quarterTo: (h) => `quarter to ${h === 12 ? 1 : h + 1}`,
                enterName: 'Please enter your name!',
                selectLang: 'Please select a language first!'
            },
            'fi-FI': {
                greeting: 'Hei',
                hourLabel: 'Tunti:',
                minuteLabel: 'Minuutit:',
                buttonText: 'Kerro kellonaika!',
                min0: '00 (tasan)',
                min15: '15 (varttia yli)',
                min30: '30 (puoli)',
                min45: '45 (varttia vaille)',
                oclock: (h) => `kello ${h}`,
                quarterPast: (h) => `varttia yli ${h}`,
                half: (h) => `puoli ${h === 12 ? 1 : h + 1}`,
                quarterTo: (h) => `varttia vaille ${h === 12 ? 1 : h + 1}`,
                enterName: 'Kirjoita nimesi!',
                selectLang: 'Valitse ensin kieli!'
            },
            'nb-NO': {
                greeting: 'Hei',
                hourLabel: 'Time:',
                minuteLabel: 'Minutter:',
                buttonText: 'Fortell meg hva klokken er!',
                min0: '00 (klokken)',
                min15: '15 (kvart over)',
                min30: '30 (halv)',
                min45: '45 (kvart på)',
                oclock: (h) => `klokken ${h}`,
                quarterPast: (h) => `kvart over ${h}`,
                half: (h) => `halv ${h === 12 ? 1 : h + 1}`,
                quarterTo: (h) => `kvart på ${h === 12 ? 1 : h + 1}`,
                enterName: 'Vennligst skriv inn navnet ditt!',
                selectLang: 'Velg et språk først!'
            }
        };

        function selectLanguage(lang) {
            selectedLanguage = lang;
            currentLang = lang;

            // Update active flag button
            document.querySelectorAll('.flag-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
        }

        function startGame() {
            const name = document.getElementById('nameInput').value.trim();

            if (!selectedLanguage) {
                alert(translations[currentLang].selectLang);
                return;
            }

            if (!name) {
                alert(translations[currentLang].enterName);
                return;
            }

            playerName = name;
            document.getElementById('playerName').textContent = playerName;
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            updateUIText();
            updateClock();
        }

        function updateUIText() {
            const trans = translations[currentLang];
            document.getElementById('greetingText').textContent = trans.greeting;
            document.getElementById('hourLabel').textContent = trans.hourLabel;
            document.getElementById('minuteLabel').textContent = trans.minuteLabel;
            document.getElementById('buttonText').textContent = trans.buttonText;
            document.getElementById('min0').textContent = trans.min0;
            document.getElementById('min15').textContent = trans.min15;
            document.getElementById('min30').textContent = trans.min30;
            document.getElementById('min45').textContent = trans.min45;
        }

        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const centerX = 200;
        const centerY = 200;

        function setHandPosition(hand, angle, length) {
            const radians = (angle - 90) * (Math.PI / 180);
            const x = centerX + length * Math.cos(radians);
            const y = centerY + length * Math.sin(radians);
            hand.setAttribute('x2', x);
            hand.setAttribute('y2', y);
        }

        function updateClock() {
            const hour = parseInt(document.getElementById('hourSelect').value);
            const minutes = parseInt(document.getElementById('minuteSelect').value);

            const minuteAngle = minutes * 6;
            setHandPosition(minuteHand, minuteAngle, 130);

            const hourAngle = (hour % 12) * 30 + (minutes / 60) * 30;
            setHandPosition(hourHand, hourAngle, 90);

            // Update digital clock display
            document.getElementById('digitalHour').textContent = hour.toString().padStart(2, '0');
            document.getElementById('digitalMinute').textContent = minutes.toString().padStart(2, '0');
        }

        function tellTime() {
            const hour = parseInt(document.getElementById('hourSelect').value);
            const minutes = parseInt(document.getElementById('minuteSelect').value);
            const trans = translations[currentLang];

            let timeText;
            if (minutes === 0) {
                timeText = trans.oclock(hour);
            } else if (minutes === 15) {
                timeText = trans.quarterPast(hour);
            } else if (minutes === 30) {
                timeText = trans.half(hour);
            } else if (minutes === 45) {
                timeText = trans.quarterTo(hour);
            }

            const utterance = new SpeechSynthesisUtterance(timeText);
            utterance.lang = currentLang;
            utterance.rate = 0.9;
            speechSynthesis.speak(utterance);
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            updateClock();
        });
    </script>
</body>
</html>
